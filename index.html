<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        var originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("No se pudo parchear window.fetch:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunns Shop — Premium Eyewear</title>
    <meta name="description" content="Tienda premium online de lentes de sol y ópticos con diseño minimalista y sofisticado." />
    <meta property="og:title" content="Sunns Shop — Premium Eyewear" />
    <meta property="og:description" content="Colección exclusiva de lentes de sol y monturas ópticas de calidad premium." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      /* Global Montserrat typography */
      body {
        font-family: 'Montserrat', sans-serif;
      }
      
      /* Editorial serif headings */
      .font-serif-elegant {

      /* Specific brand typography class for the Hero's giant GLASS editorial letters */
      .font-hero-editorial {

      /* Filled luxury ivory letter */

      }

      /* Outlined luxury serif letter */

      @media (max-width: 768px) {

          -webkit-text-stroke: 1px rgba(245, 240, 230, 0.85);
          text-stroke: 1px rgba(245, 240, 230, 0.85);
        }
      }
    </style>
